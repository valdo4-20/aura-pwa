<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="orb" cx="38%" cy="32%" r="74%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".68" stop-color="#f2f2ef"/>
      <stop offset="1" stop-color="#a7aaab"/>
    </radialGradient>
    <radialGradient id="shade" cx="50%" cy="46%" r="53%">
      <stop offset=".57" stop-color="#000" stop-opacity="0"/>
      <stop offset=".88" stop-color="#000" stop-opacity=".12"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <pattern id="dots" width="38" height="34" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="8" r="5.6" fill="#08090b"/>
      <circle cx="28" cy="25" r="5.6" fill="#08090b"/>
    </pattern>
    <clipPath id="sphere">
      <circle cx="256" cy="256" r="211"/>
    </clipPath>
    <mask id="dotFade">
      <circle cx="256" cy="256" r="211" fill="#fff"/>
      <circle cx="256" cy="256" r="211" fill="url(#shade)"/>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="#08090b"/>
  <circle cx="256" cy="256" r="211" fill="url(#orb)"/>
  <g clip-path="url(#sphere)">
    <rect x="38" y="38" width="436" height="436" fill="url(#dots)" mask="url(#dotFade)"/>
    <ellipse cx="198" cy="153" rx="126" ry="78" fill="#fff" opacity=".12"/>
  </g>
  <circle cx="256" cy="256" r="211" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
</svg>
